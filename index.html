<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Tower Defense Desert Zone</title>
<link rel="icon" href="iconos/icono.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/icono-32.png">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Desert Zone">
<style>
  :root {
    --fondo: #070a13; --panel: #0d1220; --caja: #111a2c; --linea: #1e2d4a;
    --texto: #e2e8f0; --tenue: #7d93b2; --oro: #f0c040; --rojo: #ef5a4a; --azul: #6aa9e0; --verde: #46c08a;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: var(--fondo); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow: hidden;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { cursor: default; }

  #app {
    position: relative; height: 100vh; height: 100dvh;
    width: min(100vw, calc(100vh * 0.5625)); width: min(100vw, calc(100dvh * 0.5625));
    margin: 0 auto; display: flex; flex-direction: column; background: #0a0e1a;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* Barra superior: créditos, oleada, vidas */
  #hud {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    height: 42px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--linea);
    font-variant-numeric: tabular-nums;
  }
  .dato { display: flex; align-items: baseline; gap: 5px; }
  .dato b { font-size: 16px; font-weight: 600; }
  .dato span { font-size: 11px; color: var(--tenue); }
  .dato.vidas { justify-content: flex-end; }
  .dato.vidas b { color: var(--rojo); }
  .dato.creditos b { color: var(--oro); }
  #hudOleada {
    font-size: 12px; font-weight: 600; color: var(--azul); background: #13233d;
    border: 1px solid #2a4a7a; border-radius: 6px; padding: 4px 10px;
  }

  /* Controles de oleada */
  #barra { display: flex; gap: 6px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--linea); }
  #barra button {
    height: 36px; border-radius: 8px; border: 1px solid var(--linea); background: var(--caja);
    font-size: 13px; font-weight: 600; color: var(--texto);
  }
  #barra #btnOleada { flex: 1; background: #10301f; border-color: #1f6a44; color: #8fe0b6; }
  #barra #btnOleada:disabled { background: var(--caja); border-color: var(--linea); color: var(--tenue); }
  #btnVel, #btnPausa { width: 46px; }
  #barra button.activo { background: #13233d; border-color: var(--azul); color: var(--azul); }

  /* Zoom del mapa y barra del jefe (en la página, sobre el mapa) */
  #zoomBtns { position: absolute; right: max(6px, env(safe-area-inset-right, 0px)); top: 42%; z-index: 3; display: flex; flex-direction: column; gap: 6px; }
  #zoomBtns button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid rgba(255,255,255,.25); background: rgba(10,14,26,.62); color: #e8eefc; font-size: 20px; font-weight: 700; line-height: 1; }
  #barraJefe { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; background: rgba(20,13,12,.85); pointer-events: none; }
  #barraJefe b { font-size: 10px; color: #ffd23f; letter-spacing: .05em; }
  #barraJefe span { display: block; width: 170px; height: 7px; background: #4a1513; border: 1px solid #ffd23f; }
  #barraJefe i { display: block; height: 100%; width: 100%; background: #e5342a; }
  #mapa { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #0a0e1a; }
  /* Manual del juego: pantalla completa con pestañas y contenido desplazable */
  #manual { position: absolute; inset: 0; z-index: 12; display: flex; flex-direction: column; background: #070a13; }
  #manualCab { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 8px; }
  #manualCab b { font-size: 18px; }
  #manualCerrar { width: 40px; height: 40px; border-radius: 9px; border: 1px solid var(--linea); background: var(--caja); font-size: 18px; color: var(--texto); }
  #manualTabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 0 12px 10px; border-bottom: 1px solid var(--linea); }
  #manualTabs button { height: 38px; border-radius: 8px; border: 1px solid var(--linea); background: var(--caja); font-size: 12px; padding: 0 2px; white-space: nowrap; font-weight: 600; color: var(--tenue); }
  #manualTabs button.sel { border-color: var(--azul); background: #0f1e35; color: var(--texto); }
  #manualCuerpo { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 4px 14px 28px; font-size: 14px; line-height: 1.5; color: #c6d2e3; }
  #manualCuerpo h3 { font-size: 15px; color: var(--texto); margin: 18px 0 4px; }
  #manualCuerpo p { margin: 0 0 8px; }
  #manualCuerpo ol, #manualCuerpo ul { margin: 0 0 8px; padding-left: 20px; }
  #manualCuerpo li { margin-bottom: 4px; }
  #manualCuerpo b { color: var(--texto); }
  #manualCuerpo .mnota { color: var(--tenue); font-size: 13px; margin-top: 12px; }
  .mcard { background: var(--caja); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .mcard.combo { border-color: #c04a9a; } .mcard .mdato svg { vertical-align: middle; }
  #torres .torre.bloq { opacity: .6; } #torres .torre.bloq .tc { color: var(--tenue); }
  #torres .torre.cambio { border-color: #7a2a62; background: #1d1022; }
  .mcard.hielo { border-color: #2f86ad; } .mcard.plasma { border-color: #6a4fb0; } .mcard.fuego { border-color: #8a6a1a; } .mcard.rayo { border-color: #b8a43a; } .mcard.laser { border-color: #a83232; }
  .mcard p { font-size: 13px; }
  .mcard ul { font-size: 13px; }
  .mcab { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .mcab svg { flex: none; }
  .mcab em { font-style: normal; color: var(--tenue); }
  .mcab > div { margin-left: 4px; min-width: 0; }
  .mcab b { display: block; font-size: 15px; }
  .mcab span { font-size: 12px; color: var(--tenue); }
  .mcard .mdato { color: var(--tenue); margin-bottom: 4px; }
  .mcard table { width: 100%; border-collapse: collapse; margin-top: 6px; table-layout: fixed; }
  .mcard th { text-align: left; font-size: 12px; font-weight: 600; color: var(--tenue); width: 24%; padding: 5px 0; border-top: 1px solid var(--linea); }
  .mcard td { text-align: center; padding: 5px 2px; border-top: 1px solid var(--linea); font-variant-numeric: tabular-nums; }
  .mcard td b { display: block; font-size: 13px; }
  .mcard td i { display: block; font-style: normal; font-size: 11px; color: var(--azul); }
  .mcard td span { display: block; font-size: 11px; color: var(--oro); }
  #veloManual { height: 40px; padding: 0 22px; border-radius: 10px; font-size: 14px; font-weight: 600; background: var(--caja); border: 1px solid var(--linea); color: var(--texto); }
  #manualCerrar:focus-visible, #manualTabs button:focus-visible, #veloManual:focus-visible { outline: 2px solid var(--azul); outline-offset: 1px; }
  /* Franja de pausa: no tapa el mapa, se puede seguir construyendo */
  #pausa {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; pointer-events: none;
    display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px;
    background: linear-gradient(to top, rgba(7, 10, 19, .88), rgba(7, 10, 19, 0));
  }
  #pausa span { font-size: 13px; font-weight: 700; color: var(--texto); margin-right: 4px; text-shadow: 0 1px 2px #000; }
  #pausa button {
    pointer-events: auto; height: 40px; padding: 0 14px; border-radius: 9px; font-size: 13px; font-weight: 700;
    border: 1px solid #1f6a44; background: #10301f; color: #8fe0b6;
  }
  #pausa #btnManual { border-color: var(--linea); background: #111a2c; color: var(--texto); }
  #pausa #btnReiniciar { border-color: #6a3a0a; background: #2a1a0a; color: #e0a060; }
  #pausa #btnReiniciar.confirmar { border-color: #b3261e; background: #5a1410; color: #ffd9d4; }
  #pausa button:focus-visible { outline: 2px solid var(--azul); outline-offset: 1px; }
  #aviso {
    position: absolute; left: 50%; top: 96px; transform: translateX(-50%); z-index: 3; pointer-events: none;
    background: rgba(13, 18, 32, .92); border: 1px solid var(--linea); border-radius: 999px;
    padding: 5px 12px; font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .25s;
  }
  #aviso.ver { opacity: 1; }

  /* Panel inferior */
  #panel { background: var(--panel); border-top: 1px solid var(--linea); padding: 8px; }
  /* Fila de torres: todas a la vista, en columnas iguales (7 torres) */
  #torres { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
  /* Fila de torres combo: 10 torres + Volver, en dos filas de 6 */
  #torres.combo { grid-auto-flow: row; grid-template-columns: repeat(6, minmax(0, 1fr)); }
  #torres.combo .torre { height: 52px; }
  #torres .torre { min-width: 0; padding: 0 1px; }
  #torres .torre .tn { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: clip; max-width: 100%; }
  #torres .torre .tc { font-size: 11.5px; }
  .torre {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    height: 58px; border-radius: 8px; border: 1px solid var(--linea); background: var(--caja);
  }
  .torre .tn { font-size: 11px; color: var(--tenue); }
  .torre .tc { font-size: 12px; font-weight: 600; color: var(--oro); font-variant-numeric: tabular-nums; }
  .torre .tenue { color: #56698a; font-weight: 400; }
  .torre.sel { border-color: var(--azul); background: #0f1e35; box-shadow: inset 0 0 0 1px var(--azul); }
  .torre.caro .tc { color: var(--rojo); }
  .torre:disabled { opacity: .55; }
  #atributos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .atrib {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    height: 58px; border-radius: 8px; border: 1px solid #2a6aaa; background: #0f2a4a; padding: 0 4px;
  }
  .atrib .an { font-size: 11px; color: #9cc9f2; display: flex; align-items: center; gap: 5px; }
  .atrib .pp { display: inline-flex; gap: 2px; }
  .atrib .pp i { width: 6px; height: 6px; border-radius: 50%; background: #1e3a5c; border: 1px solid #3f6c9c; }
  .atrib .pp i.on { background: var(--oro); border-color: var(--oro); }
  .atrib .av { font-size: 13px; font-weight: 600; color: var(--texto); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .atrib .ac { font-size: 11px; font-weight: 600; color: var(--oro); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .atrib:disabled { background: var(--caja); border-color: var(--linea); }
  .atrib:disabled .ac { color: var(--rojo); }
  .atrib.max .ac { color: var(--verde); }
  .atrib:focus-visible { outline: 2px solid var(--azul); outline-offset: 1px; }

  #info { margin-top: 8px; background: var(--caja); border: 1px solid var(--linea); border-radius: 8px; padding: 8px 10px; height: 128px; display: flex; flex-direction: column; }
  #infoTitulo { font-size: 13px; font-weight: 600; }
  #infoDet { font-size: 12px; color: var(--tenue); margin-top: 2px; line-height: 1.35; }
  #infoSin { font-size: 12px; color: var(--oro); margin-top: 2px; line-height: 1.35; }
  #acciones { display: flex; gap: 6px; margin-top: auto; }
  #acciones button {
    flex: 1; min-width: 0; height: 40px; border-radius: 8px; border: 1px solid var(--linea); background: #0b1220;
    font-size: 12px; font-weight: 600; line-height: 1.15; padding: 0 4px;
  }
  #btnConstruir, #btnMejorar { background: #0f2a4a !important; border-color: #2a6aaa !important; color: #9cc9f2; flex: 1.6 !important; }
  #btnVender { color: #e0a060; border-color: #6a3a0a !important; }
  #acciones button:disabled { opacity: .5; }

  /* Pantalla de inicio / final */
  #velo {
    position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; background: rgba(7, 10, 19, .93);
  }
  #veloTitulo { font-size: 28px; font-weight: 700; letter-spacing: .02em; line-height: 1.15; margin: 0; text-wrap: balance; }
  #veloCredito { position: absolute; left: 0; right: 0; bottom: 18px; margin: 0; font-size: 12px; color: var(--tenue); }
  #veloSub { font-size: 13px; color: var(--tenue); margin: 0; }
  #veloMapas, #veloModos { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .mapaBtn {
    flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px;
    border-radius: 10px; border: 1px solid var(--linea); background: var(--caja);
  }
  .mapaBtn b { font-size: 14px; color: var(--texto); }
  .mapaBtn span { font-size: 11px; color: var(--tenue); line-height: 1.3; }
  .mapaBtn span.ok { color: var(--verde); }
  .mapaBtn.sel { border-color: var(--azul); background: #0f1e35; box-shadow: inset 0 0 0 1px var(--azul); }
  .mapaBtn:disabled { opacity: .5; }
  .mapaBtn:focus-visible { outline: 2px solid var(--azul); outline-offset: 1px; }
  #veloDatos { display: flex; gap: 10px; width: 100%; justify-content: center; }
  #veloDatos div { flex: 1; max-width: 120px; background: var(--caja); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 6px; }
  #veloDatos b { display: block; font-size: 20px; color: var(--oro); font-variant-numeric: tabular-nums; }
  #veloDatos span { font-size: 11px; color: var(--tenue); }
  #veloDatos p { font-size: 13px; color: var(--tenue); line-height: 1.5; max-width: 280px; margin: 0; }
  #veloContinuar { min-width: 220px; height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid #2a6aaa; background: #0f2a4a; color: #9cc9f2; font-size: 15px; font-weight: 700; }
  #veloBoton {
    margin-top: 6px; height: 48px; padding: 0 36px; border-radius: 10px; font-size: 16px; font-weight: 700;
    background: #10301f; border: 1px solid #1f6a44; color: #8fe0b6;
  }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="dato creditos"><b id="hudCreditos">0</b><span>créditos</span></div>
    <div id="hudOleada">Oleada 0 / 50</div>
    <div class="dato vidas"><b id="hudVidas">20</b><span>vidas</span></div>
  </header>
  <div id="barra">
    <button id="btnOleada">▶ Iniciar oleada 1</button>
    <button id="btnVel" aria-label="Velocidad">×1</button>
    <button id="btnPausa" aria-label="Pausa">II</button>
  </div>
  <div id="aviso"></div>
  <div id="mapa">
    <div id="barraJefe" hidden><b>JEFE</b><span><i id="barraJefeVida"></i></span></div>
    <div id="zoomBtns"><button id="zoomMas" aria-label="Acercar">+</button><button id="zoomMenos" aria-label="Alejar" hidden>−</button></div>
    <div id="pausa" hidden><button id="btnContinuar">▶ Continuar</button><button id="btnReiniciar">↻ Reiniciar</button><button id="btnManual">Manual</button></div>
  </div>
  <section id="panel">
    <div id="torres"></div>
    <div id="atributos" hidden><button class="atrib" id="atrib0"></button><button class="atrib" id="atrib1"></button><button class="atrib" id="atrib2"></button></div>
    <div id="info">
      <div id="infoTitulo"></div>
      <div id="infoDet"></div>
      <div id="infoSin"></div>
      <div id="acciones">
        <button id="btnConstruir" hidden></button>
        <button id="btnCancelar" hidden>Cancelar</button>
        <button id="btnMejorar" hidden></button>
        <button id="btnPrioridad" hidden></button>
        <button id="btnMover" hidden></button>
        <button id="btnVender" hidden></button>
      </div>
    </div>
  </section>
  <div id="manual" hidden>
    <div id="manualCab"><b>Manual del juego</b><button id="manualCerrar" aria-label="Cerrar manual">✕</button></div>
    <div id="manualTabs"><button data-tab="jugar">Jugar</button><button data-tab="torres">Torres</button><button data-tab="combos">Combos</button><button data-tab="trios">Fusión</button><button data-tab="enemigos">Enemigos</button></div>
    <div id="manualCuerpo"></div>
  </div>
  <div id="velo">
    <h1 id="veloTitulo"></h1>
    <p id="veloSub"></p>
    <div id="veloMapas"></div>
    <div id="veloModos"></div>
    <div id="veloDatos"></div>
    <button id="veloContinuar" hidden></button>
    <button id="veloBoton">Jugar</button>
    <button id="veloManual">Manual del juego</button>
    <p id="veloCredito"></p>
  </div>
</div>
<script src="phaser.min.js"></script>
<script src="datos.js?v=0.14.2"></script>
<script src="juego.js?v=0.14.2"></script>
<script>
  // Permite instalar el juego y usarlo sin internet (solo funciona publicado en la web)
  if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') {
    // Si llega una versión nueva mientras el juego está abierto, se recarga solo una vez
    var teniaControl = !!navigator.serviceWorker.controller, recargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (teniaControl && !recargado) { recargado = true; location.reload(); }
    });
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
